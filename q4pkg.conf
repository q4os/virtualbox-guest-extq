# Q4OS package manifest - machine readable metadata for build tooling and agents
source="virtualbox-guest-extq"
kind="external"
binaries="virtualbox-guest-extq"
targets="deb11 deb12 deb13 uqk3 uqk4 uqk5"
upstream_url="https://www.virtualbox.org"
upstream_watch="distro:virtualbox-guest-x11"
notes="No publish_repo= set deliberately - confirmed live 2026-08-10 this
package has a genuine per-distro-family split (Debian side ->
repos_local_q4os/qexarepo/vboxadds only, absent from q4repo; Quark side ->
quarkrp/default only, absent from any qexa/qext instance) that
publishdebs.sh's per-binary publish_repo= mechanism cannot express - it
only overrides per BINARY, not per distro-family, and building that second
dimension wasn't judged worth it for this one package (owner's explicit
call). Default routing here correctly covers the Quark side (the actually-
active one); the Debian-side qexarepo/vboxadds publish remains a manual,
unautomated step until/unless family-scoped routing gets built."
